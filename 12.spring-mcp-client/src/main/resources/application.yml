server:
  port: 8090

app:
  key: xyz
  aimodel: gemma4

spring:
#  docker:
#    compose:
#      enabled: true
#      file: 11.spring-rag/docker-compose.yml
  ai:
    model:
      embedding: openai
    embedding:
      transformer:
        onnx:
          model-uri: classpath:models/model.onnx
#          gpu-device-id: 0
        tokenizer:
          uri: classpath:models/tokenizer.json
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection-name: mi_coleccion_rag
    openai:
      api-key: ${app.key}
      base-url: http://localhost:8080
      chat:
        model: ${app.aimodel}
    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json


logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
